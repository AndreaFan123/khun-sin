name: Education release checks

on:
  pull_request:
    paths:
      - "education/**"
      - ".github/workflows/education.yml"
  push:
    branches: [main, develop]
    paths:
      - "education/**"
      - ".github/workflows/education.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: education
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: education/package-lock.json
      - run: npm ci
      - name: Lint, typecheck, test, build and inspect rendered SEO
        run: npm run check:release
